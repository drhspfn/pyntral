services:
  shop:
    build:
      context: ../..
      dockerfile: examples/shop/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      # Raw mode prevents Docker Compose from expanding the $ signs in bcrypt hashes.
      # Requires Docker Compose >=2.30.
      - path: ../../.env
        format: raw
    environment:
      DATABASE_URL: sqlite:////app/data/shop.db
      ADMIN_SECURE_COOKIE: "false" # Local HTTP smoke test only
    volumes:
      - shop-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  shop-data:
